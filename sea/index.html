<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16a3c6">
<meta name="description" content="Niki's Sea: six islands of research, making, community, music and sport.">
<title>Niki's Sea</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%2316a3c6'/%3E%3Cpath d='M9 24c5 6 17 6 22 0-7 2-15 2-22 0Z' fill='%23fff'/%3E%3Cpath d='M20 9v13l7-3z' fill='%23ff6f59'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./sea.css">
<script type="importmap">{"imports":{"three":"../dist/vendor/three.module.js"}}</script>
</head>
<body>
<div id="sea" aria-hidden="true"></div>

<header class="bar">
  <div class="bar-left">
    <a class="logo" href="#/">Niki</a>
    <a class="pill back" id="back" href="#/">← Back to the sea</a>
  </div>
  <nav class="bar-tools" aria-label="Site">
    <button id="edit-text" class="pill" type="button">Edit text</button>
    <button id="text-cancel" class="pill" type="button">Cancel</button>
    <button id="text-save" class="pill pill-strong" type="button">Save</button>
    <button id="theme" class="pill" aria-pressed="false" aria-label="Switch to night">Night</button>
    <a class="pill pill-strong" href="#/contact">Contact</a>
  </nav>
</header>

<main>
  <h1 class="sr-only">Hi, I'm Niki. Pick an island.</h1>
  <nav id="labels" aria-label="Islands"></nav>
  <nav id="islet-labels" aria-label="Islets"></nav>
  <section class="golf" id="golf" aria-labelledby="zoom-title" tabindex="-1">
    <p class="golf-why" id="golf-why" data-slot="why"></p>
    <div class="prints" id="prints"></div>
    <div class="tour" id="tour" hidden></div>
    <p class="film-hint" id="film-hint" aria-hidden="true"><span class="for-mouse">Scroll to browse · Click to zoom</span><span class="for-touch">Swipe to browse · Tap to zoom</span></p>
    <ul class="facts" id="facts"></ul>
  </section>
  <div class="zoom-ui">
    <p class="zoom-title" id="zoom-title" data-slot="title"></p>
  </div>
</main>

<aside id="panel" class="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
  <div class="panel-top">
    <span class="panel-where" id="panel-where"></span>
    <span class="panel-tools">
      <button class="round" id="cards-prev" type="button" aria-label="Previous card">←</button>
      <button class="round" id="cards-next" type="button" aria-label="Next card">→</button>
      <a class="pill" id="panel-next" href="#/"></a>
    </span>
  </div>
  <div class="panel-body" id="panel-body" tabindex="-1"></div>
</aside>

<p class="text-status" id="text-status" role="status"></p>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo" hidden>
  <button class="round viewer-close" type="button" aria-label="Close photo">×</button>
  <button class="round viewer-prev" type="button" aria-label="Previous photo">←</button>
  <figure><img src="" alt=""><video controls playsinline preload="none" hidden></video><figcaption></figcaption></figure>
  <button class="round viewer-next" type="button" aria-label="Next photo">→</button>
</div>

<div class="viewer" id="scorecard" role="dialog" aria-modal="true" aria-labelledby="scorecard-title" hidden>
  <button class="round viewer-close" type="button" aria-label="Close scorecard">×</button>
  <div class="scorecard" id="scorecard-body"></div>
</div>

<div class="fade" id="fade"></div>

<script type="module" src="./sea.js"></script>
</body>
</html>
